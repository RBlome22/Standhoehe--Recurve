name: Clean English archery apps
on:
  push:
    paths:
      - '.github/workflows/clean-english.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean English user-visible text and restore identifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, pairs):
              p=Path(path); t=p.read_text(encoding='utf-8')
              for a,b in pairs:
                  if a in t:
                      t=t.replace(a,b)
              p.write_text(t,encoding='utf-8')

          # Brace Height Optimizer
          rep('brace-height-en/index.html',[
            ('Select photo. Danach linke und rechte Kante der Scheibenauflage antippen. Anschließend die arrows antippen.','Select a photo. Then tap the left and right edge of the target face for calibration. Afterwards mark the arrow impacts.'),
            ('<section class="card printOnly"><h2>Versuchsablauf</h2><p>Je Standhöhe werden 6 arrows geschossen. Pro end wird ein Outlier gestrichen. Die App berechnet aus den verbleibenden impactn die konvexe groupsfläche in cm². Die Standhöhe mit dem kleinsten Areaninhalt wird als optimum Standhöhe markiert.</p></section>','<section class="card printOnly"><h2>Test procedure</h2><p>Shoot 6 arrows at each brace-height setting. One outlier is discarded from each end. The app calculates the convex group area of the remaining impacts in cm². The brace height with the smallest group area is marked as optimum.</p></section>'),
            ('Select photo oder mit Camera aufnehmen','Select a photo or take one with the camera'),
            ('Kalibrierung vorhanden. Please Mark arrow impacts. Aktuell: ${state.arrows.length}.','Calibration set. Please mark arrow impacts. Current: ${state.arrows.length}.'),
            ('Reset calibration: zwei Kanten der Scheibenauflage antippen.','Reset calibration: tap two opposite edges of the target face.'),
            ('Please Kalibrierung setzen und ${need} Mark arrow impacts.','Please set the calibration and mark ${need} arrow impacts.'),
            ('end gespeichert. Nächste Standhöhe schießen und neues Select photo.','End saved. Shoot the next brace-height setting and select a new photo.'),
            ('<th>end</th><th>Standhöhe</th><th>Area</th><th>groups-Ø</th><th>gestrichen</th><th>Date</th><th class=\'noPrint\'>Action</th>','<th>End</th><th>Brace height</th><th>Area</th><th>Group Ø</th><th>Discarded</th><th>Date</th><th class=\'noPrint\'>Action</th>'),
            ('onclick="deleteends(${s.id})"','onclick="deleteSeries(${s.id})"'),
            ('window.deleteends=id=>','window.deleteSeries=id=>'),
            ('id="saveendsBtn"','id="saveSeriesBtn"'),
            ('$("saveendsBtn")','$("saveSeriesBtn")'),
            ('Alle gespeicherten endn delete?','Delete all saved ends?'),
            ('[["end","Standhoehe","Unit","Flaeche_cm2","group diameter_mm","Gestrichener_arrow","Date"]]','[["End","Brace_height","Unit","Area_cm2","Group_diameter_mm","Discarded_arrow","Date"]]'),
            ('download("standhoehe_recurve_messwerte.csv"','download("recurve_brace_height_measurements.csv"'),
            ('download("standhoehe_recurve_sicherung.json"','download("recurve_brace_height_backup.json"'),
            ('Outlier arrow','outlier arrow'),('Area ${res.areaCm2','area ${res.areaCm2')
          ])

          # Bare Shaft Tuner
          rep('bare-shaft-tuner-en/index.html',[
            ('Starting position hergestellt – Messserie beginnen','Starting position set – begin measurement series'),
            ('<b>3 fletched arrows at 16 m</b> shoot. Then record the three impacts in one photo.','Shoot <b>3 fletched arrows at 16 m</b>. Then record the three impacts in one photo.'),
            ('<b>3 bare shafts at 16 m</b> schießen. The fletched arrows may be removed first. This photo is corrected separately using the target-face corners.','Shoot <b>3 bare shafts at 16 m</b>. The fletched arrows may be removed first. This photo is corrected separately using the target-face corners.'),
            ('Letzten Punkt löschen','Delete last point'),
            ("return '<b>Grundziel '+(state.hand==='right'?'Right-handed':'Left-handed')+':</b> bare shafts leicht <b>'+side+'</b> und leicht <b>lower</b> als die fletched group. Die konkrete zulässige target zone wird aus der measured grouping des archer angepasst.'","return '<b>Base target for '+(state.hand==='right'?'right-handed':'left-handed')+' archer:</b> bare shafts slightly <b>'+side+'</b> and slightly <b>lower</b> than the fletched group. The permitted target zone is adapted to the archer’s measured grouping.'"),
            ('treated internalally','treated internally'),
            ("'<b>New setup:</b> Starting position wird definiert hergestellt. Die absolute manufacturer limit für das Herausdrehen muss angegeben werden.'","'<b>New setup:</b> A defined starting position is established. Enter the manufacturer’s absolute limit for turning the limb bolts out.'"),
            ("'Right-handed → bare shafts leicht left und leicht lower.'","'Right-handed → bare shafts slightly left and slightly lower.'"),
            ("'Left-handed → bare shafts leicht right und leicht lower.'","'Left-handed → bare shafts slightly right and slightly lower.'"),
            ('<b>Olympic recurve:</b><ol><li>Beide limb bolts carefully turn fully in.</li><li>Upper limb bolt <b>1 turn out</b>.</li><li>Lower limb bolt bleibt fully in.</li></ol>Weitere draw weightskorrekturen erfolgen anschließend an beiden limb bolts equally.','<b>Olympic recurve:</b><ol><li>Carefully turn both limb bolts fully in.</li><li>Turn the upper limb bolt <b>1 turn out</b>.</li><li>Keep the lower limb bolt fully in.</li></ol>Further draw-weight corrections are made equally on both limb bolts.'),
            ('<b>Barebow:</b> Beide limb bolts carefully turn fully in. Diese equallye Stellung ist der Ausgang.','<b>Barebow:</b> Carefully turn both limb bolts fully in. This equal position is the starting point.'),
            ("+' markieren.'","+' mark.'"),
            ('Automatischer Vorschlag gesetzt. Gelben Rahmen prüfen. Wenn er nicht exakt an der Auflage liegt, „Reset corners manually“ wählen.','Automatic corner proposal set. Check the yellow frame. If it does not match the target face exactly, choose “Reset corners manually”.'),
            ('<div class="metric">Vertikal<b>','<div class="metric">Vertical<b>'),
            ("+' bis '+","+' to '+"),
            ('<tr><td>Befiedert</td>','<tr><td>Fletched</td>'),
            ('<tr><td>Blank</td>','<tr><td>Bare shafts</td>'),
            ('<b>Limit reached.</b> In der Correction ist maximal +1 turn out erlaubt.','<b>Limit reached.</b> In correction mode, a maximum of +1 turn out is allowed.'),
            ('<b>Before finishing:</b> Beide limb bolts noch <b>','<b>Before finishing:</b> Turn both limb bolts <b>'),
            ("+'</b>, to return exactly to the stored optimum position.","+'</b> to return exactly to the stored optimum position."),
            ('<div class="metric">Ziel vertical<b>','<div class="metric">Target vertical<b>'),
            ('function startends()','function startSeries()'),('startends()','startSeries()'),
            ('function evaluateends()','function evaluateSeries()'),('evaluateends()','evaluateSeries()')
          ])

          # Bow Setup Assistant
          rep('bow-setup-assistant-en/index.html',[
            ('Nur Brace height öffnen','Open brace height only'),('Nur Bare shaft öffnen','Open bare shaft only'),
            ('Phase 1 – Brace height optimieren','Phase 1 – Optimize brace height'),
            ('Führe die Brace heightnmessung vollständig durch. Danach bottom auf <b>„Brace height abgeschlossen“</b> drücken. Wenn die App im gleichen Browser läuft, versucht der Assistent das beste Ergebnis automatisch zu übernehmen.','Complete the full brace-height test. Then press <b>“Brace height completed – import result”</b> below. If the app runs in the same browser, the assistant will try to import the best result automatically.'),
            ('title="Brace heightn-Optimierer"','title="Brace Height Optimizer"'),
            ('Brace height abgeschlossen – Ergebnis übernehmen','Brace height completed – import result'),
            ('Optimale Brace height (optional)','Optimum brace height (optional)'),('22,4 cm','22.4 cm'),
            ('<b>Note:</b> Der groupsdurchmesser dient hier nur als Orientierung für den Leistungsstand. Der Bare shaft-Tuner bestimmt seine personal Toleranz anschließend neu aus der aktuellen fletchedn Referenzgruppe.','<b>Note:</b> The group diameter is used only as an indication of current repeatability. The Bare Shaft Tuner recalculates the personal tolerance from the current fletched reference group.'),
            ('Weiter zur Bare shaft-Abstimmung','Continue to bare-shaft tuning'),('Back zur Brace height','Back to brace height'),
            ('Phase 2 – Bare shaft, nocking point und Tiller','Phase 2 – Bare shaft, nocking point and tiller'),
            ('Back zum Intermediate result','Back to intermediate result'),
            ('<b>Archer-adapted setup:</b> Die Bare shaft-Abstimmung berücksichtigt die aktuelle grouping des archer. Bei später deutlich verbesserter Schießtechnik empfiehlt sich eine againe Korrektur.','<b>Archer-adapted setup:</b> The bare-shaft tuning takes the archer’s current grouping into account. If shooting technique and repeatability improve significantly later, repeat the correction.'),
            ('Brace height einzeln','Brace height only'),('Bare shaft einzeln','Bare shaft only'),
            ("names=['Übersicht','Brace height','Übernahme','Bare shaft','Done']","names=['Overview','Brace height','Import','Bare shaft','Done']"),
            ('<b>Brace heightn-Ergebnis gefunden.</b>','<b>Brace-height result found.</b>'),('groups-Ø','Group Ø'),
            ('Übernommene optimum Brace height','Imported optimum brace height'),
            ('Der Bare shaft-Tuner ermittelt seine Toleranz jetzt again aus den 3 fletchedn Referenzpfeilen.','The Bare Shaft Tuner now recalculates its tolerance from the 3 fletched reference arrows.'),
            ('nocking point/Tiller/arrowabstimmung: im Bare shaft-Tuner abgeschlossen.','Nocking point / tiller / arrow tuning: completed in the Bare Shaft Tuner.')
          ])

          # Light normalization that cannot touch IDs/functions
          for fn in ['brace-height-en/index.html','bare-shaft-tuner-en/index.html','bow-setup-assistant-en/index.html']:
              p=Path(fn); t=p.read_text(encoding='utf-8')
              t=t.replace('Bare shaft Tuner','Bare Shaft Tuner').replace('Brace height Tuner','Brace Height Tuner')
              p.write_text(t,encoding='utf-8')
          PY
      - name: Audit remaining German text
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('brace-height-en/index.html'),Path('bare-shaft-tuner-en/index.html'),Path('bow-setup-assistant-en/index.html')]
          pats=[r'\b(Danach|Anschließend|Bitte|Zurück|Weiter|Speichern|löschen|Löschen|Pfeil|Pfeile|Serie|Serien|Standhöhe|Scheibe|Scheibenauflage|Kalibrierung|Messung|Messserie|Auswertung|Bogen|Wurfarme|Schütze|Schützen|Gruppe|Gruppierung|Treffer|Nockpunkt|Tillerschraube|Tillerschrauben|Zuggewicht|heraus|hinein|tiefer|höher|Einstellung|Korrektur|Hersteller|Umdrehung|Umdrehungen|Zielfläche|Abweichung|befiedert|Blankschaft|Blankschäfte|Ausreißer|Fläche|Datum|Aktion|Versuchsablauf|gespeichert|laden|geladen|markieren|markiert|gestrichen|vorhanden|gefunden|nicht|noch|wird|werden|muss|darf|gleichmäßig|leicht|Übernahme|Übersicht|Führe|drücken|läuft|versucht|Ergebnis|übernehmen|Referenzpfeilen|abgeschlossen|einzeln|optimieren|und|zur|zum|Die|Der|Bei)\b',r'[äöüÄÖÜß]']
          out=[]
          for p in files:
              out.append('## '+str(p))
              for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
                  if any(re.search(x,line) for x in pats): out.append(f'{i}: {line}')
              out.append('')
          Path('english/german-residue.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit cleaned English apps
        run: |
          git config user.name "RBlome22"
          git config user.email "r.blome@rainer-blome.de"
          git add brace-height-en/index.html bare-shaft-tuner-en/index.html bow-setup-assistant-en/index.html english/german-residue.txt
          git commit -m "Fully clean English archery app wording" || true
          git push
