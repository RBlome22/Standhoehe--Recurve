name: Audit English archery apps
on:
  push:
    paths:
      - '.github/workflows/audit-english.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan English pages for German residues
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('brace-height-en/index.html'),Path('bare-shaft-tuner-en/index.html'),Path('bow-setup-assistant-en/index.html')]
          patterns=[
            r'\b(Danach|Anschließend|Bitte|Zurück|Weiter|Speichern|löschen|Löschen|Foto|Kamera|Pfeil|Pfeile|Serie|Serien|Standhöhe|Scheibe|Scheibenauflage|Kalibrierung|Messung|Messserie|Auswertung|Bogen|Wurfarme|Schütze|Schützen|Gruppe|Gruppierung|Treffer|Nockpunkt|Tillerschraube|Tillerschrauben|Zuggewicht|heraus|hinein|links|rechts|oben|unten|tiefer|höher|Einstellung|Korrektur|optimal|Optimum|Hersteller|Umdrehung|Umdrehungen|Bereich|Zielfläche|Abweichung|steif|weich|befiedert|Blankschaft|Blankschäfte|Ausreißer|Fläche|Datum|Aktion|Versuchsablauf|gespeichert|laden|geladen|markieren|markiert|gestrichen|vorhanden|gefunden|nicht|noch|wird|werden|kann|muss|darf|und|oder|mit|als|aus|für|auf|bei|nach|vor|jetzt|erneut|erneute|gleichmäßig|leicht|persönlich|angepasst|eingeschränkt)\b',
            r'[äöüÄÖÜß]'
          ]
          out=[]
          for p in files:
              text=p.read_text(encoding='utf-8')
              out.append(f'## {p}')
              # show only lines with likely German residue
              for i,line in enumerate(text.splitlines(),1):
                  if any(re.search(x,line) for x in patterns):
                      out.append(f'{i}: {line}')
              out.append('')
          Path('english/german-residue.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name "RBlome22"
          git config user.email "r.blome@rainer-blome.de"
          git add english/german-residue.txt
          git commit -m "Audit English apps for German residues" || true
          git push
