name: Update Pfeilkauf V8

on:
  push:
    paths:
      - '.github/workflows/update-pfeilkauf-v8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V8 patch
        run: |
          echo '' | base64 -d > /tmp/patchv8.py
          python /tmp/patchv8.py
      - name: Commit app update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pfeilkauf/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add Aerotec Matrix and point purchase names"
            git push
          fi
