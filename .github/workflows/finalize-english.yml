name: Finalize English standalone apps
on:
  push:
    paths:
      - '.github/workflows/finalize-english.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and generate standalone English apps
        run: |
          node --check english/translations.js
          node --check english/fixes.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          global.window={};
          vm.runInThisContext(fs.readFileSync('english/translations.js','utf8'));
          vm.runInThisContext(fs.readFileSync('english/fixes.js','utf8'));
          const jobs=[
            ['index.html','translateBrace','brace-height-en/index.html'],
            ['blankschaft-tuner-v261/index.html','translateBare','bare-shaft-tuner-en/index.html'],
            ['bogen-setup-assistent/index.html','translateCombo','bow-setup-assistant-en/index.html']
          ];
          for(const [src,fn,dst] of jobs){
            const input=fs.readFileSync(src,'utf8');
            const output=window.ArcheryEN[fn](input);
            fs.writeFileSync(dst,output,'utf8');
            console.log(dst,'generated',output.length,'bytes');
          }
          NODE
      - name: Commit standalone English apps
        run: |
          git config user.name "RBlome22"
          git config user.email "r.blome@rainer-blome.de"
          git add brace-height-en/index.html bare-shaft-tuner-en/index.html bow-setup-assistant-en/index.html
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git commit -m "Finalize standalone English archery apps"
            git push
          fi