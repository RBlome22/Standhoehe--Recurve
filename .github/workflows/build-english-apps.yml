name: Build English archery apps

on:
  push:
    paths:
      - '.github/workflows/build-english-apps.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build English versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          def apply(text, pairs):
              for old, new in pairs:
                  text = text.replace(old, new)
              return text

          # ---------- 1) Brace Height Optimizer ----------
